[package]
name = "leptos-routes-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = """
Proc macro deriving route structs for the leptos-routes crate.
"""
categories = ["web-programming", "gui"]
keywords = ["leptos-routes", "leptos", "routes", "routing", "router"]
include = ["src/**/*.rs"]
autotests = false

[lib]
proc-macro = true

[dependencies]
proc-macro-error2 = { version = "2.0.0", default-features = false }
proc-macro2 = { version = "1.0.91", default-features = false, features = ["proc-macro"] }
quote = { version = "1.0.35", default-features = false }
syn = { version = "3.0.6", default-features = false, features = ["clone-impls", "extra-traits", "full", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
assertr = { version = "0.7.1", default-features = false }
leptos = { version = "0.8.22", default-features = false, features = ["ssr"] }
leptos-routes = { path = "../leptos-routes", default-features = false }
leptos_router = { version = "0.8.17", default-features = false, features = ["ssr"] }
trybuild = { version = "1.0.121", default-features = false, features = ["diff"] }

[[test]]
name = "tests"
path = "tests/progress.rs"
