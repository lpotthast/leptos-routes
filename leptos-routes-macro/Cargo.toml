[package]
name = "leptos-routes-macro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
description = """
Proc macro deriving route structs for the leptos-routes crate.
"""
categories = ["web-programming", "gui"]
keywords = ["leptos-routes", "leptos", "routes", "routing", "router"]
autotests = false

[lib]
proc-macro = true

[dependencies]
proc-macro-error2 = "2.0.0"
proc-macro2 = "1.0.91"
quote = "1.0.35"
syn = { version = "2.0.0", features = ["extra-traits", "full"] }

[dev-dependencies]
assertr = "0.5.0"
leptos = { version = "0.8.17", features = ["ssr"] }
leptos-routes = { path = "../leptos-routes" }
leptos_router = { version = "0.8.12", features = ["ssr"] }
trybuild = { version = "1.0.116", features = ["diff"] }

[[test]]
name = "tests"
path = "tests/progress.rs"
